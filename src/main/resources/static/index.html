<!DOCTYPE html>
<html>
<head>
    <title>VIT Result Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            min-height: 100vh;
        }

        /* Header */

        .header {
            background: #8b0000;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
        }

        /* Main container */

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        /* Search card */

        .search-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .search-card h2 {
            color: #333;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8b0000;
        }

        .button-container {
            text-align: center;
            margin-top: 25px;
        }

        button {
            background: #8b0000;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #650000;
        }

        /* Result section */

        #result {
            display: none;
        }

        .result-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .student-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .student-info div {
            font-size: 17px;
        }

        .student-info strong {
            color: #8b0000;
        }

        /* Table */

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #8b0000;
            color: white;
            padding: 14px;
            text-align: center;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        td:first-child {
            text-align: left;
            font-weight: bold;
        }

        tr:hover {
            background: #f9eeee;
        }

        /* Summary */

        .summary {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .summary-card {
            flex: 1;
            padding: 20px;
            text-align: center;
            background: #f9eeee;
            border-radius: 10px;
        }

        .summary-card h3 {
            color: #555;
            margin-bottom: 8px;
        }

        .summary-card p {
            font-size: 25px;
            font-weight: bold;
            color: #8b0000;
        }

        /* Error */

        .error {
            background: #ffe5e5;
            color: #b00000;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        /* Footer */

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
            margin-top: 40px;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .container {
                width: 95%;
            }

            .student-info {
                flex-direction: column;
                gap: 10px;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }

            .summary {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>VIT Result Management</h1>
        <p>Student Result Portal</p>
    </div>


    <div class="container">

        <!-- Search Section -->

        <div class="search-card">

            <h2>Check Your Result</h2>

            <div class="form-group">
                <label for="prn">PRN</label>
                <input
                    type="text"
                    id="prn"
                    placeholder="Enter your PRN"
                >
            </div>

            <div class="form-group">
                <label for="name">Student Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                >
            </div>

            <div class="button-container">
                <button onclick="getResult()">
                    View Result
                </button>
            </div>

            <div id="error"></div>

        </div>


        <!-- Result Section -->

        <div id="result"></div>

    </div>


    <footer>
        VIT Result Management System
    </footer>


    <script>

        async function getResult() {

            const prn = document.getElementById("prn").value.trim();
            const name = document.getElementById("name").value.trim();

            const resultDiv = document.getElementById("result");
            const errorDiv = document.getElementById("error");

            /* Clear previous messages */

            resultDiv.style.display = "none";
            errorDiv.innerHTML = "";

            /* Check input */

            if (prn === "" || name === "") {

                errorDiv.innerHTML =
                    '<div class="error">Please enter both PRN and Name.</div>';

                return;
            }


            try {

                const response = await fetch(
                    `/students/result?prn=${encodeURIComponent(prn)}&name=${encodeURIComponent(name)}`
                );


                if (!response.ok) {

                    throw new Error("Student not found");

                }


                const student = await response.json();


                /* Display result */

                resultDiv.innerHTML = `

                    <div class="result-card">

                        <h2>Student Result</h2>


                        <div class="student-info">

                            <div>
                                <strong>Name:</strong>
                                ${student.name}
                            </div>

                            <div>
                                <strong>PRN:</strong>
                                ${student.prn}
                            </div>

                        </div>


                        <h3>Subject-wise Performance</h3>


                        <table>

                            <thead>

                                <tr>
                                    <th>Subject</th>
                                    <th>MSE</th>
                                    <th>ESE</th>
                                    <th>Final Marks</th>
                                </tr>

                            </thead>


                            <tbody>

                                <tr>
                                    <td>${student.subject1}</td>
                                    <td>${student.subject1Mse}</td>
                                    <td>${student.subject1Ese}</td>
                                    <td>${student.subject1Final.toFixed(2)}</td>
                                </tr>

                                <tr>
                                    <td>${student.subject2}</td>
                                    <td>${student.subject2Mse}</td>
                                    <td>${student.subject2Ese}</td>
                                    <td>${student.subject2Final.toFixed(2)}</td>
                                </tr>

                                <tr>
                                    <td>${student.subject3}</td>
                                    <td>${student.subject3Mse}</td>
                                    <td>${student.subject3Ese}</td>
                                    <td>${student.subject3Final.toFixed(2)}</td>
                                </tr>

                                <tr>
                                    <td>${student.subject4}</td>
                                    <td>${student.subject4Mse}</td>
                                    <td>${student.subject4Ese}</td>
                                    <td>${student.subject4Final.toFixed(2)}</td>
                                </tr>

                            </tbody>

                        </table>


                        <div class="summary">

                            <div class="summary-card">

                                <h3>Total Marks</h3>

                                <p>
                                    ${student.totalMarks.toFixed(2)}
                                </p>

                            </div>


                            <div class="summary-card">

                                <h3>Percentage</h3>

                                <p>
                                    ${student.percentage.toFixed(2)}%
                                </p>

                            </div>

                        </div>

                    </div>
                `;


                resultDiv.style.display = "block";

            }


            catch (error) {

                errorDiv.innerHTML =
                    '<div class="error">Student not found. Please check the PRN and Name.</div>';

            }

        }

    </script>

</body>
</html>
